<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Warung Rush — Masak Cepat, Sajikan Cepat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;padding:0;background:#2b1d12;height:100%;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif}
  #wrap{width:960px;max-width:100vw}
  canvas{display:block;width:960px;height:600px;max-width:100%;background:#f7e8c8;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #help{color:#f3e2c0;font-size:13px;text-align:center;padding:8px 4px 0;line-height:1.5}
  #help b{color:#ffd166}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="help">Klik bahan di meja untuk meracik pesanan, klik <b>wajan</b> untuk memasak, lalu <b>Sajikan</b> sebelum pelanggan kehabisan sabar. Tombol <b>1–9, 0</b> = bahan, <b>Spasi</b> = sajikan, <b>C</b> = buang piring.</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
